# NOVAFILM VPS: Postgres + Redis + API (Frontend is static on Firebase Hosting).
#
#   cp deploy/.env.prod.example deploy/.env.prod   # 改密码、密钥、域名
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.prod up -d
#
# 这里的每一个 ${VAR} 都没有默认值：漏配就在 `up` 的那一刻报错，而不是让容器带着
# 别人的口令或别人的域名跑起来。
name: novafilm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/.env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER} -d ${POSTGRES_DB:?set POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 只绑回环：VPS 上的 Postgres 不该暴露给公网，运维直连用 SSH 隧道。
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - deploy/.env.prod
    environment:
      # 容器之间走服务名，不走回环地址：127.0.0.1 在容器里指的是它自己。
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      # 成片、分镜素材、以及 OSS 关闭时用户自己上传的资产图片（后端写到
      # static/generated/p{project_id}/，与成片同一目录）：换容器不丢，备份也是备份这一份。
      # 少挂这一个卷，用户的角色图会在重建容器时无声消失。
      - media:/app/static/generated
      - voice_previews:/app/static/voice_previews
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    ports:
      # 同样只绑回环：公网入口是 VPS 上的 nginx，它负责 TLS 和域名。
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
  redis_data:
  media:
  voice_previews: