<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover so the full-bleed bands can reach under a notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NOVAFILM · Nền tảng phim AI</title>
    <meta
      name="description"
      content="NOVAFILM: nhập điểm bán và phong cách, tự động tạo phân cảnh, hình ảnh, lời dẫn và thành phẩm video."
    />
    <!-- The browser chrome has to match the app, or the mobile URL bar reads
         as a light strip above a dark page. Both values are token values: the
         light one is --pf-bg, the dark one is --pf-bg in the dark block. -->
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e11" media="(prefers-color-scheme: dark)" />

    <!--
      ONE preload, and it is the hero.

      The candidates MUST be the same files, in the same order, at the same
      densities as `--pf-media-hero` in media.css. A preload is a promise about
      one specific request; if it names a file the stylesheet never asks for,
      the browser fetches the promised file AND the file the page actually
      paints. Measured with scripts/perf-audit.mjs before this was aligned:

        every route   158 KB  /img/retro-narrative-film-1280.jpg  preloaded
                      47 KB  /img/retro-narrative-film-640.jpg   the one painted

      The 158 KB was pure waste on all five routes, and on the four routes that
      have no hero band at all it was the *only* thing downloaded. Now the
      preload names 640 and 1280, which is exactly what the image-set requests,
      so it warms the real request instead of a parallel one.

      What is deliberately NOT preloaded, and why:

      - The other photographs. They are CSS background-images, so the browser
        only requests them once the element that uses them is styled; preloading
        would spend bandwidth on art the visitor may never scroll to.

      - Fonts. Three families at five weights cannot be fetched in parallel with
        the app bundle without making LCP worse, and display=swap already covers
        the gap. Measure a font preload on a real connection before adding one.

      - The component <img> previews. They now carry a srcset over the
        derivatives in public/img/, so a preload would have to name every
        candidate and every density to stay honest. Leave them to be lazy.
    -->
    <link
      rel="preload"
      as="image"
      imagesrcset="/img/retro-narrative-film-640.jpg 1x, /img/retro-narrative-film-1280.jpg 2x"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif:wght@500;700&family=Noto+Serif+SC:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
